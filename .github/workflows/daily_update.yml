name: Daily Price Update

on:
  schedule:
    # 매일 한국 시간(KST) 오전 09:00 실행 (UTC 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # GitHub 웹 화면에서 수동으로 'Run workflow' 버튼 클릭 가능

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 실거래가 및 네이버 호가 데이터 수집
        env:
          MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
        run: |
          python3 update_prices.py --no-push

      - name: 최신 데이터 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json index.html
          if git diff --staged --quiet; then
            echo "변경된 데이터가 없습니다."
          else
            git commit -m "chore: 실거래가 및 네이버 호가 정기 자동 업데이트 (GitHub Actions)"
            git push
          fi
